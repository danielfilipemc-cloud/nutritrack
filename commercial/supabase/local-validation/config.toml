# Local synthetic validation only. CLI 2.120.0. Never link this runtime to cloud.
project_id = "aura-foundations-local"
[api]
enabled = true
port = 57321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 57322
shadow_port = 57320
major_version = 17
[db.pooler]
enabled = false
[db.migrations]
enabled = true
schema_paths = []
[db.seed]
enabled = false
[realtime]
enabled = false
[studio]
enabled = false
[storage]
enabled = false
[local_smtp]
enabled = true
port = 57324
[auth]
enabled = true
site_url = "http://127.0.0.1:3187"
additional_redirect_urls = ["http://127.0.0.1:3187/convite", "http://127.0.0.1:3187/convite?aluno=1"]
