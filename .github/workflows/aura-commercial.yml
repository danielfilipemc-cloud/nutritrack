# AURA-only validation; no deployment or production secrets.
name: AURA commercial validation
on:
  push:
    branches: [saas-foundation, 'design/**', 'feat/aura-**']
    paths: ['commercial/**', '.github/workflows/aura-commercial.yml']
  pull_request:
    paths: ['commercial/**', '.github/workflows/aura-commercial.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commercial
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: commercial/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=moderate

  local-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commercial
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://aura-test.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_e2e_fixture
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: aura-browser-failure
          path: commercial/test-results
          retention-days: 7
