# Install at .github/workflows/aura-commercial.yml to activate on GitHub.
name: AURA commercial validation
on:
  push:
    branches: [saas-foundation, 'design/**']
    paths: ['commercial/**', '.github/workflows/aura-commercial.yml']
  pull_request:
    paths: ['commercial/**', '.github/workflows/aura-commercial.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commercial
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: commercial/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=moderate
